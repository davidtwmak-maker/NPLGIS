name: Deploy NPL GIS site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify data files are intact
        run: |
          set -euo pipefail
          echo "Checking gzipped layers can be decompressed..."
          fail=0
          for f in assets/data/**/*.gz assets/data/*.gz; do
            [ -e "$f" ] || continue
            if gzip -t "$f"; then
              printf '  ok   %s (%s)\n' "$f" "$(du -h "$f" | cut -f1)"
            else
              printf '  FAIL %s\n' "$f"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || { echo "::error::a .gz file is corrupt"; exit 1; }

      - name: Verify the 3D scene's GeoJSON is present and parseable
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, sys
          data = pathlib.Path("apps/festival-walk-3d/data")
          files = sorted(data.glob("*.geojson"))
          if not files:
              sys.exit("::error::no GeoJSON found for the 3D scene")
          total = 0
          for f in files:
              d = json.loads(f.read_text())
              n = len(d.get("features", []))
              total += n
              print(f"  ok   {f.name}: {n} features")
          print(f"  total {total} features across {len(files)} layers")
          PY

      - name: Build the student worksheet pages
        run: |
          set -euo pipefail
          python3 scripts/build_worksheets.py
          test -f worksheet-site/index.html
          n=$(ls worksheet-site/*.html | wc -l | tr -d ' ')
          echo "  ok   $n worksheet pages built"
          [ "$n" -eq 7 ] || { echo "::error::expected 7 worksheet pages, got $n"; exit 1; }

      - name: Verify every map referenced by the landing page exists
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys
          html = pathlib.Path("index.html").read_text()
          refs = set(re.findall(r'(?:src|href)="\./([^"#]+)"', html))
          missing = []
          for r in sorted(refs):
              if r.startswith("http"):
                  continue
              p = pathlib.Path(r)
              # the worksheet pages are generated into worksheet-site/ and
              # published at /worksheets/, so check the source of truth
              if not p.exists() and r.startswith("worksheets/"):
                  p = pathlib.Path("worksheet-site") / r.split("/", 1)[1]
              if not p.exists():
                  missing.append(r)
          for m in missing:
              print(f"  MISSING {m}")
          if missing:
              sys.exit(f"::error::{len(missing)} referenced file(s) missing")
          print(f"  ok   all {len([r for r in refs if not r.startswith('http')])} local references resolve")
          PY
      - name: Check no file exceeds the GitHub push limit
        run: |
          set -euo pipefail
          big=$(find . -path ./.git -prune -o -type f -size +95M -print)
          if [ -n "$big" ]; then
            echo "::error::these files exceed 95 MB and would be rejected by GitHub:"
            echo "$big"
            exit 1
          fi
          echo "  ok   no file over 95 MB"

      - name: Verify the landslide susceptibility web map's data is intact
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, sys
          data = pathlib.Path("apps/landslide-susceptibility/data")
          grid = json.loads((data / "susceptibility_grid.json").read_text())
          n = grid["rows"] * grid["cols"]
          if len(grid["scores"]) != n:
              sys.exit(f"::error::score array is {len(grid['scores'])}, expected {n}")
          if len(grid["classes"]) != 5:
              sys.exit("::error::expected 5 susceptibility classes")
          total = sum(c["cells"] for c in grid["classes"])
          if total != grid["land_cells"]:
              sys.exit(f"::error::class cells sum to {total}, expected {grid['land_cells']}")
          resid = grid["fit"]["max_residual_m"]
          if resid > 0.01:
              sys.exit(f"::error::projection fit residual {resid} m is too coarse for a 200 m cell")
          print(f"  ok   {n} scores, 5 classes, {grid['land_cells']} land cells")
          print(f"  ok   projection fit residual {resid*1000:.2f} mm")
          for png in ("susceptibility_surface.png", "landslide_points.png"):
              p = data / png
              if not p.exists() or p.stat().st_size < 1000:
                  sys.exit(f"::error::{png} missing or too small")
              print(f"  ok   {png} ({p.stat().st_size//1024} KB)")
          for f in pathlib.Path("assets/data/landslide").glob("*.gz"):
              import gzip
              with gzip.open(f, "rt", encoding="utf-8") as fh:
                  feats = json.load(fh)["features"]
              print(f"  ok   {f.name}: {len(feats)} features")
          PY

      - name: Stage the site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html arcgis-scene.html favicon.png LICENSE.txt README.md _site/
          cp -R assets apps _site/
          cp -R worksheet-site _site/worksheets
          # the per-project notes are linked from the web map and the landing
          # page, so they must be published, not just committed
          mkdir -p _site/notes
          cp notes/*.md _site/notes/
          echo "staged $(du -sh _site | cut -f1)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
